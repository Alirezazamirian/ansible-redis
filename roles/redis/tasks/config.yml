---
# All configuration tasks go here

- name: Make sure the dir {{ redis_config_dir }} exists
  ansible.builtin.file:
    path: "{{ redis_config_dir }}"
    state: directory
    owner: root
    group: "{{ redis_group }}"
    mode: "0755"
    seuser: "{{ 'system_u' if ansible_selinux.status == 'enabled' else omit }}"
    serole: "{{ 'object_r' if ansible_selinux.status == 'enabled' else omit }}"
    setype: "{{ 'etc_t' if ansible_selinux.status == 'enabled' else omit }}"
    selevel: "{{ 's0' if ansible_selinux.status == 'enabled' else omit }}"
  tags: config_redis
  when: redis_config_dir is defined and redis_config_dir != ""

- name: Make sure the dir {{ redis_working_dir }} exists
  ansible.builtin.file:
    path: "{{ redis_working_dir }}"
    state: directory
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: "0755"
    seuser: "{{ 'system_u' if ansible_selinux.status == 'enabled' else omit }}"
    serole: "{{ 'object_r' if ansible_selinux.status == 'enabled' else omit }}"
    setype: "{{ 'redis_var_lib_t' if ansible_selinux.status == 'enabled' else omit }}"
    selevel: "{{ 's0' if ansible_selinux.status == 'enabled' else omit }}"
  tags: config_redis
  when: redis_working_dir is defined and redis_working_dir != ""

- name: Create Redis configuration files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
    seuser: "{{ 'system_u' if ansible_selinux.status == 'enabled' else omit }}"
    serole: "{{ 'object_r' if ansible_selinux.status == 'enabled' else omit }}"
    setype: "{{ 'etc_t' if ansible_selinux.status == 'enabled' else omit }}"
    selevel: "{{ 's0' if ansible_selinux.status == 'enabled' else omit }}"
  loop: "{{ redis_conf_templates }}"
  tags: config_redis
  no_log: "{{ 'false' if lookup('env', 'CI') else 'true' }}"

- name: Create users ACL configuration file
  ansible.builtin.template:
    src: "users.acl.j2"
    dest: "{{ redis_security_acl_file_path }}"
    owner: root
    group: root
    mode: "0644"
    seuser: "{{ 'system_u' if ansible_selinux.status == 'enabled' else omit }}"
    serole: "{{ 'object_r' if ansible_selinux.status == 'enabled' else omit }}"
    setype: "{{ 'etc_t' if ansible_selinux.status == 'enabled' else omit }}"
    selevel: "{{ 's0' if ansible_selinux.status == 'enabled' else omit }}"
  no_log: "{{ 'false' if lookup('env', 'CI') else 'true' }}"
  tags: config_redis
  when: redis_security_acl_enable

- name: Create Redis Sentinel configuration files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
    seuser: "{{ 'system_u' if ansible_selinux.status == 'enabled' else omit }}"
    serole: "{{ 'object_r' if ansible_selinux.status == 'enabled' else omit }}"
    setype: "{{ 'etc_t' if ansible_selinux.status == 'enabled' else omit }}"
    selevel: "{{ 's0' if ansible_selinux.status == 'enabled' else omit }}"
  loop: "{{ redis_sentinel_conf_templates }}"
  tags: config_redis
  no_log: "{{ 'false' if lookup('env', 'CI') else 'true' }}"
  when:
    - redis_sentinel_conf_templates is defined and redis_sentinel_conf_templates | length > 0
    - redis_sentinel_enable

- name: Pre-config on OS to prepare Redis setup
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: 1
    state: present
    sysctl_file: "/etc/sysctl.conf"
  tags: config_redis

- name: Disable huge-page at kernel level
  ansible.builtin.command:
    cmd: echo never > /sys/kernel/mm/transparent_hugepage/enabled
  tags: config_redis

- name: Import TLS encryption connection
  ansible.builtin.import_tasks:
    file: "tls.yml"
  tags: redis_tls
  when: redis_tls_enable

- name: Apply Redis systemd template
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/redis.service"
    owner: root
    group: root
    mode: "0644"
    seuser: "{{ 'system_u' if ansible_selinux.status == 'enabled' else omit }}"
    serole: "{{ 'object_r' if ansible_selinux.status == 'enabled' else omit }}"
    setype: "{{ 'redis_unit_file_t' if ansible_selinux.status == 'enabled' else omit }}"
    selevel: "{{ 's0' if ansible_selinux.status == 'enabled' else omit }}"
  loop: "{{ redis_systemd_service_templates }}"
  tags: config_redis
  register: systemd_template
  when:
    - redis_systemd_service_templates is defined and redis_systemd_service_templates | length >= 1
    - redis_sentinel_enable is defined and (redis_sentinel_enable | bool or not redis_sentinel_enable | bool)

- name: Reload systemd-daemon alongside Redis relevant services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ redis_systemd_service_templates | map('regex_replace', '\\.j2$', '') | list }}"
  when: systemd_template is success
  notify: Redis Restart
