---
# TLS configuration goes here

- name: Make sure the TLS-related dir exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ redis_exporter_system_group }}"
    mode: "0755"
    seuser: "{{ 'system_u' if ansible_selinux.status == 'enabled' else omit }}"
    serole: "{{ 'object_r' if ansible_selinux.status == 'enabled' else omit }}"
    setype: "{{ 'etc_t' if ansible_selinux.status == 'enabled' else omit }}"
    selevel: "{{ 's0' if ansible_selinux.status == 'enabled' else omit }}"
  when:
    - redis_exporter_tls_dir_path is defined and redis_exporter_tls_dir_path != ""
    - redis_exporter_conf_dir_path is defined and redis_exporter_conf_dir_path != ""
  loop:
    - "{{ redis_exporter_conf_dir_path }}"
    - "{{ redis_exporter_tls_dir_path }}"

- name: Find & Delete all cert files located at project-level
  run_once: true
  tags: redisex_cert_removal
  block:
    - name: Find all files in certs dir
      ansible.builtin.find:
        paths: "{{ redis_exporter_tls_dir_path }}"
        file_type: file
      register: found_certs

    - name: Delete all cert files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ found_certs.files }}"

    - name: Find all certs located on localhost/roles files
      ansible.builtin.find:
        path: "{{ role_path }}/files"
        file_type: file
      register: found_localhost_certs
      delegate_to: localhost
      connection: local
      become: false

    - name: Delete all certs located on localhost files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ found_localhost_certs.files }}"
      delegate_to: localhost
      connection: local
      become: false

- name: Make sure the package openssh-client exists for key generation
  ansible.builtin.package:
    name: openssh-client
    state: present
  register: openssl_install
  delegate_to: localhost
  connection: local
  run_once: true

- name: Ensure pip package cryptography exists
  ansible.builtin.pip:
    name:
      - cryptography
    state: present
    executable: "{{ role_path | dirname | dirname }}/venv/bin/pip"
    break_system_packages: false
  register: pip_installation
  delegate_to: localhost
  connection: local
  run_once: true

- name: Make sure root key-pair exists on Redis role which, signed redis nodes' keys
  ansible.builtin.find:
    path: "{{ role_path | dirname }}/redis/files"
    file_type: file
  register: found_root_keypairs
  delegate_to: localhost
  connection: local
  become: false

- name: Generate a key-pair for each Redis Exporter with its signing method
  delegate_to: localhost
  connection: local
  become_user: hostvars['localhost'].ansible_user
  no_log: true
  when:
    - openssl_install is success
    - pip_installation is success
    - "'root.crt' in (found_root_keypairs.files | map(attribute='path') | map('basename') | list)"
    - "'root.key' in (found_root_keypairs.files | map(attribute='path') | map('basename') | list)"
    - redis_tls_enable
  block:
    - name: Generate an OpenSSL private key as each Redis-Ex host's key
      community.crypto.openssl_privatekey:
        path: "{{ role_path }}/files/redis-ex-{{ inventory_hostname.split('_') | last }}.key"
        owner: "{{ hostvars['localhost'].ansible_user }}"
        group: "{{ hostvars['localhost'].ansible_user }}"
        mode: "0440"
        seuser: "{{ 'system_u' if ansible_selinux.status == 'enabled' else omit }}"
        serole: "{{ 'object_r' if ansible_selinux.status == 'enabled' else omit }}"
        setype: "{{ 'cert_t' if ansible_selinux.status == 'enabled' else omit }}"
        selevel: "{{ 's0' if ansible_selinux.status == 'enabled' else omit }}"
        passphrase: "{{ redis_exporter_tls_client_privkey_pass if redis_exporter_tls_client_privkey_pass != '' else omit }}"
        state: present
        size: 4096
        format: pkcs8
        type: Ed25519

    - name: Generate an OpenSSL CSR for each Redis-Ex's host
      community.crypto.openssl_csr:
        path: "{{ role_path }}/files/redis-ex-{{ inventory_hostname.split('_') | last }}.csr"
        privatekey_path: "{{ role_path }}/files/redis-ex-{{ inventory_hostname.split('_') | last }}.key"
        privatekey_passphrase: "{{ redis_exporter_tls_client_privkey_pass if redis_exporter_tls_client_privkey_pass != '' else omit }}"
        owner: "{{ hostvars['localhost'].ansible_user }}"
        group: "{{ hostvars['localhost'].ansible_user }}"
        mode: "0440"
        seuser: "{{ 'system_u' if ansible_selinux.status == 'enabled' else omit }}"
        serole: "{{ 'object_r' if ansible_selinux.status == 'enabled' else omit }}"
        setype: "{{ 'cert_t' if ansible_selinux.status == 'enabled' else omit }}"
        selevel: "{{ 's0' if ansible_selinux.status == 'enabled' else omit }}"
        common_name: "redis-ex-{{ inventory_hostname.split('_') | last }}.charging.local"
        country_name: "IR"
        organization_name: "BBDH"
        organizational_unit_name: "Charging Department"
        state: present
        email_address: "a.zamirian@siz-tel.ir"
        state_or_province_name: "TEH"
        use_common_name_for_san: false
        subject_alt_name:
          - "DNS:redis-ex-{{ inventory_hostname.split('_') | last }}.charging.local"
          - "IP:{{ ansible_ens33.ipv4.address }}"
        subject_alt_name_critical: true

    - name: Sign each Redis node's CSR with the root key-pair
      community.crypto.x509_certificate:
        path: "{{ role_path }}/files/redis-ex-{{ inventory_hostname.split('_') | last }}.crt"
        mode: "0440"
        owner: "{{ hostvars['localhost'].ansible_user }}"
        group: "{{ hostvars['localhost'].ansible_user }}"
        state: present
        seuser: "{{ 'system_u' if ansible_selinux.status == 'enabled' else omit }}"
        serole: "{{ 'object_r' if ansible_selinux.status == 'enabled' else omit }}"
        setype: "{{ 'cert_t' if ansible_selinux.status == 'enabled' else omit }}"
        selevel: "{{ 's0' if ansible_selinux.status == 'enabled' else omit }}"
        provider: ownca
        ownca_privatekey_path: "{{ role_path | dirname }}/redis/files/root.key"
        ownca_path: "{{ role_path | dirname }}/redis/files/root.crt"
        ownca_privatekey_passphrase: "{{ redis_exporter_tls_client_privkey_pass if redis_exporter_tls_client_privkey_pass != '' else omit }}"
        ownca_not_before: "-1d"
        ownca_not_after: "+3650d"
        ownca_digest: "sha256"
        csr_path: "{{ role_path }}/files/redis-ex-{{ inventory_hostname.split('_') | last }}.csr"
      register: sign_client_certificate

- name: Generate a key-pair for web-based observation
  delegate_to: localhost
  connection: local
  become_user: hostvars['localhost'].ansible_user
  no_log: true
  when:
    - openssl_install is success
    - pip_installation is success
    - redis_exporter_use_tls
  block:
    - name: Generate an OpenSSL private key(Redis-Ex web observation)
      community.crypto.openssl_privatekey:
        path: "{{ role_path }}/files/redis-ex-web-{{ inventory_hostname.split('_') | last }}.key"
        owner: "{{ hostvars['localhost'].ansible_user }}"
        group: "{{ hostvars['localhost'].ansible_user }}"
        mode: "0440"
        seuser: "{{ 'system_u' if ansible_selinux.status == 'enabled' else omit }}"
        serole: "{{ 'object_r' if ansible_selinux.status == 'enabled' else omit }}"
        setype: "{{ 'cert_t' if ansible_selinux.status == 'enabled' else omit }}"
        selevel: "{{ 's0' if ansible_selinux.status == 'enabled' else omit }}"
        passphrase: "{{ redis_exporter_tls_client_privkey_pass if redis_exporter_tls_client_privkey_pass != '' else omit }}"
        state: present
        size: 4096
        format: pkcs8
        type: RSA

    - name: Generate an OpenSSL CSR(Redis-Ex web observation)
      community.crypto.openssl_csr:
        path: "{{ role_path }}/files/redis-ex-web-{{ inventory_hostname.split('_') | last }}.csr"
        privatekey_path: "{{ role_path }}/files/redis-ex-web-{{ inventory_hostname.split('_') | last }}.key"
        privatekey_passphrase: "{{ redis_exporter_tls_client_privkey_pass if redis_exporter_tls_client_privkey_pass != '' else omit }}"
        owner: "{{ hostvars['localhost'].ansible_user }}"
        group: "{{ hostvars['localhost'].ansible_user }}"
        mode: "0440"
        seuser: "{{ 'system_u' if ansible_selinux.status == 'enabled' else omit }}"
        serole: "{{ 'object_r' if ansible_selinux.status == 'enabled' else omit }}"
        setype: "{{ 'cert_t' if ansible_selinux.status == 'enabled' else omit }}"
        selevel: "{{ 's0' if ansible_selinux.status == 'enabled' else omit }}"
        key_usage:
          - digitalSignature
          - keyEncipherment
        key_usage_critical: true
        common_name: "Redis Ex. Root CA"
        country_name: "IR"
        organization_name: "BBDH"
        organizational_unit_name: "Charging Department"
        state: present
        email_address: "a.zamirian@siz-tel.ir"
        state_or_province_name: "TEH"
        use_common_name_for_san: false
        subject_alt_name:
          - "DNS:administration.charging.local"
          - "IP:{{ hostvars['localhost'].ansible_default_ipv4.address }}"
        subject_alt_name_critical: true

    - name: Sign each Redis node's CSR with the generated key-pair(Redis-Ex web observation)
      community.crypto.x509_certificate:
        path: "{{ role_path }}/files/redis-ex-web-{{ inventory_hostname.split('_') | last }}.crt"
        mode: "0440"
        owner: "{{ hostvars['localhost'].ansible_user }}"
        group: "{{ hostvars['localhost'].ansible_user }}"
        state: present
        seuser: "{{ 'system_u' if ansible_selinux.status == 'enabled' else omit }}"
        serole: "{{ 'object_r' if ansible_selinux.status == 'enabled' else omit }}"
        setype: "{{ 'cert_t' if ansible_selinux.status == 'enabled' else omit }}"
        selevel: "{{ 's0' if ansible_selinux.status == 'enabled' else omit }}"
        provider: selfsigned
        privatekey_path: "{{ role_path }}/files/redis-ex-web-{{ inventory_hostname.split('_') | last }}.key"
        privatekey_passphrase: "{{ redis_tls_root_privkey_pass if redis_tls_root_privkey_pass != '' else omit }}"
        select_crypto_backend: cryptography
        selfsigned_digest: sha512
        selfsigned_not_after: +365d
        selfsigned_not_before: "-1d"
        csr_path: "{{ role_path }}/files/redis-ex-web-{{ inventory_hostname.split('_') | last }}.csr"
      register: selfsigned_server_certificate

- name: Spread relevant keys across desired Redis-ex nodes(Client's keys)
  ansible.builtin.copy:
    dest: "{{ redis_exporter_tls_dir_path }}/{{ redis_exporter_tls_client_certs_basename }}.{{ item | basename | split('.') | last }}"
    src: "{{ item }}"
    mode: "0440"
    owner: "{{ redis_exporter_system_user }}"
    group: "{{ redis_exporter_system_group }}"
    seuser: "{{ 'system_u' if ansible_selinux.status == 'enabled' else omit }}"
    serole: "{{ 'object_r' if ansible_selinux.status == 'enabled' else omit }}"
    setype: "{{ 'cert_t' if ansible_selinux.status == 'enabled' else omit }}"
    selevel: "{{ 's0' if ansible_selinux.status == 'enabled' else omit }}"
    remote_src: false
  loop:
    - "{{ role_path }}/files/redis-ex-{{ inventory_hostname.split('_') | last }}.crt"
    - "{{ role_path }}/files/redis-ex-{{ inventory_hostname.split('_') | last }}.key"
    - "{{ role_path }}/files/redis-ex-{{ inventory_hostname.split('_') | last }}.csr"
  when: sign_client_certificate is success

- name: Spread relevant keys across desired Redis-ex nodes(Server's keys)
  ansible.builtin.copy:
    dest: "{{ redis_exporter_tls_dir_path }}/{{ redis_exporter_tls_server_certs_basename }}.{{ item | basename | split('.') | last }}"
    src: "{{ item }}"
    mode: "0440"
    owner: "{{ redis_exporter_system_user }}"
    group: "{{ redis_exporter_system_group }}"
    seuser: "{{ 'system_u' if ansible_selinux.status == 'enabled' else omit }}"
    serole: "{{ 'object_r' if ansible_selinux.status == 'enabled' else omit }}"
    setype: "{{ 'cert_t' if ansible_selinux.status == 'enabled' else omit }}"
    selevel: "{{ 's0' if ansible_selinux.status == 'enabled' else omit }}"
    remote_src: false
  loop:
    - "{{ role_path }}/files/redis-ex-web-{{ inventory_hostname.split('_') | last }}.crt"
    - "{{ role_path }}/files/redis-ex-web-{{ inventory_hostname.split('_') | last }}.key"
    - "{{ role_path }}/files/redis-ex-web-{{ inventory_hostname.split('_') | last }}.csr"
  when: selfsigned_server_certificate is success

- name: Spread the root CA across all Redis-Ex nodes
  ansible.builtin.copy:
    src: "{{ role_path | dirname }}/redis/files/root.crt"
    dest: "{{ redis_exporter_tls_client_ca_file_path }}"
    mode: "0440"
    owner: "{{ redis_exporter_system_user }}"
    group: "{{ redis_exporter_system_group }}"
    seuser: "{{ 'system_u' if ansible_selinux.status == 'enabled' else omit }}"
    serole: "{{ 'object_r' if ansible_selinux.status == 'enabled' else omit }}"
    setype: "{{ 'cert_t' if ansible_selinux.status == 'enabled' else omit }}"
    selevel: "{{ 's0' if ansible_selinux.status == 'enabled' else omit }}"
    remote_src: false
  when:
    - sign_client_certificate is success
    - "'root.crt' in (found_root_keypairs.files | map(attribute='path') | map('basename') | list)"
    - "'root.key' in (found_root_keypairs.files | map(attribute='path') | map('basename') | list)"
